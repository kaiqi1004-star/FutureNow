openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: futureReady
    description: Read-only access to the supplied FutureNow datasets
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /future-ready/overview:
    get:
      operationId: getFutureReadyOverview
      tags: [futureReady]
      summary: Get a verified summary of the supplied datasets
      responses:
        "200":
          description: Dataset and job-record summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FutureReadyOverview"
  /future-ready/jobs:
    get:
      operationId: getFutureReadyJobs
      tags: [futureReady]
      summary: List the supplied job records
      responses:
        "200":
          description: Job records from the uploaded workbook
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListing"
  /future-ready/role-matches:
    post:
      operationId: matchFutureReadyRoles
      tags: [futureReady]
      summary: Rank supplied job records using selected profile skills and structured fit context
      description: Stateless deterministic profile-to-role estimates. No profile is stored and no hiring probability is predicted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleMatchInput"
      responses:
        "200":
          description: Ranked real records, skill explanations, and indicative SDG connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleMatchResults"
        "400":
          description: Invalid skill list
  /future-ready/skill-gap:
    post:
      operationId: analyzeFutureReadySkillGap
      tags: [futureReady]
      summary: Compare user skills with one supplied job record
      description: Calculates deterministic coverage from distinct listed technical and soft-skill requirements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillGapInput"
      responses:
        "200":
          description: Skill comparison and learning roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGapAnalysis"
        "400":
          description: Invalid request or sector does not match the selected job
        "404":
          description: Job record not found
  /future-ready/unemployment:
    get:
      operationId: getFutureReadyUnemployment
      tags: [futureReady]
      summary: Get monthly youth unemployment observations
      responses:
        "200":
          description: Monthly observations for ages 15-24 and 15-30
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnemploymentObservation"
  /future-ready/labour-market:
    get:
      operationId: getFutureReadyLabourMarket
      tags: [futureReady]
      summary: Retrieve and cache the current OpenDOSM monthly labour-force dataset
      responses:
        "200":
          description: Validated observations and source/retrieval metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabourMarketData"
        "502":
          description: The current dataset could not be fetched or validated and no cached copy is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /future-ready/labour-market/refresh:
    post:
      operationId: refreshFutureReadyLabourMarket
      tags: [futureReady]
      summary: Force a fresh retrieval of the OpenDOSM dataset
      responses:
        "200":
          description: Refreshed observations or the last successful cached observations marked stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabourMarketData"
        "502":
          description: Refresh failed and no successful cached copy is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /future-ready/wages:
    get:
      operationId: getFutureReadyWages
      tags: [futureReady]
      summary: Get annual wage observations by occupation or skill category
      responses:
        "200":
          description: Wage observations from both annual CSV files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WageObservation"
  /future-ready/underemployment:
    get:
      operationId: getFutureReadyUnderemployment
      tags: [futureReady]
      summary: Get quarterly skills-related underemployment observations
      responses:
        "200":
          description: Observations grouped by measure and age
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnderemploymentObservation"
components:
  schemas:
    RoleMatchInput:
      type: object
      additionalProperties: false
      properties:
        currentSkills:
          type: array
          maxItems: 150
          items:
            type: string
            maxLength: 100
        relevantExperienceYears:
          type: number
          minimum: 0
          maximum: 80
          description: Optional explicitly self-reported years of relevant work experience. Total work experience is not substituted.
        educationLevel:
          type: string
          maxLength: 80
          description: Optional selected education level from the saved profile. No free-text profile answers are sent.
      required: [currentSkills]
    SdgConnection:
      type: object
      properties:
        goalNumber:
          type: integer
          enum: [4, 5, 8, 9, 12]
        title:
          type: string
        target:
          type: string
        url:
          type: string
        explanation:
          type: string
        evidence:
          type: string
        ruleId:
          type: string
        conditions:
          type: string
        indicative:
          type: boolean
        contextEvidence:
          type: array
          items:
            type: string
      required: [goalNumber, title, target, url, explanation, evidence, ruleId, conditions, indicative, contextEvidence]
    SdgAssessment:
      type: object
      properties:
        status:
          type: string
          enum: [mapped, review_required, not_assessed]
        assessmentNote:
          type: string
        connections:
          type: array
          items:
            $ref: "#/components/schemas/SdgConnection"
        reviewRequired:
          type: boolean
        reviewReason:
          type: ["string", "null"]
      required: [status, assessmentNote, connections, reviewRequired, reviewReason]
    RoleMatchSkill:
      type: object
      properties:
        skill:
          type: string
        category:
          type: string
          enum: [technical, soft]
          description: Original source array category; retained independently from the primary scoring category.
        scoreCategory:
          type: string
          enum: [industry-specific, technical, digital, soft]
          description: One primary scoring category assigned from the source role context.
        matchedBy:
          type: ["string", "null"]
        matchType:
          type: ["string", "null"]
          enum: [exact, equivalent, source-alternative, null]
        sdg:
          $ref: "#/components/schemas/SdgAssessment"
      required: [skill, category, scoreCategory, matchedBy, matchType, sdg]
    RelatedRoleSkill:
      type: object
      properties:
        profileSkill:
          type: string
        requirement:
          type: string
        explanation:
          type: string
      required: [profileSkill, requirement, explanation]
    RoleTitleSignal:
      type: object
      properties:
        profileSkill:
          type: string
        sourceText:
          type: string
        explanation:
          type: string
      required: [profileSkill, sourceText, explanation]
    CareerLevel:
      type: string
      enum: [internship, entry, mid, senior, lead, manager, unspecified]
    MatchDimensionStatus:
      type: string
      enum: [meets, gap, uncertain, not_provided, not_stated, not_required, unavailable]
    ExperienceRequirementType:
      type: string
      enum: [mandatory, preferred, source_range, conditional, qualitative, explicit_none, inferred, unavailable]
    ExperienceRequirementBasis:
      type: string
      enum: [source, title_guideline, unavailable]
    EducationRequirementType:
      type: string
      enum: [mandatory, conditional, not_stated, unrecognized]
    EducationRequirementBasis:
      type: string
      enum: [source, conditional, unavailable]
    RoleExperienceFit:
      type: object
      properties:
        roleLevel:
          $ref: "#/components/schemas/CareerLevel"
        requirementType:
          $ref: "#/components/schemas/ExperienceRequirementType"
        sourceText:
          type: string
        basis:
          $ref: "#/components/schemas/ExperienceRequirementBasis"
        sourceMinimumYears:
          type: ["number", "null"]
        guidelineYears:
          type: ["number", "null"]
        userYears:
          type: ["number", "null"]
        suitabilityScore:
          type: ["number", "null"]
        status:
          $ref: "#/components/schemas/MatchDimensionStatus"
        summary:
          type: string
        reason:
          type: string
      required: [roleLevel, requirementType, sourceText, basis, sourceMinimumYears, guidelineYears, userYears, suitabilityScore, status, summary, reason]
    RoleEducationFit:
      type: object
      properties:
        requirementType:
          $ref: "#/components/schemas/EducationRequirementType"
        sourceText:
          type: string
        basis:
          $ref: "#/components/schemas/EducationRequirementBasis"
        minimumLevel:
          type: ["integer", "null"]
        userLevel:
          type: ["integer", "null"]
        userEducation:
          type: ["string", "null"]
        suitabilityScore:
          type: ["number", "null"]
        status:
          $ref: "#/components/schemas/MatchDimensionStatus"
        summary:
          type: string
        reason:
          type: string
      required: [requirementType, sourceText, basis, minimumLevel, userLevel, userEducation, suitabilityScore, status, summary, reason]
    ScoreCategory:
      type: string
      enum: [industry-specific, technical, digital, soft, experience, evidence, broad-technical-areas]
    ScoreBreakdownStatus:
      type: string
      enum: [scored, not-applicable, not-specified, unknown, not-scorable, excluded]
    ScoreBreakdownItem:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/ScoreCategory"
        matchedCount:
          type: integer
        requiredCount:
          type: integer
        coverage:
          type: ["number", "null"]
        baseWeight:
          type: number
        effectiveWeight:
          type: ["number", "null"]
        contribution:
          type: ["number", "null"]
        status:
          $ref: "#/components/schemas/ScoreBreakdownStatus"
        explanation:
          type: string
      required: [category, matchedCount, requiredCount, coverage, baseWeight, effectiveWeight, contribution, status, explanation]
    CompatibilityTier:
      type: integer
      enum: [1, 2, 3]
    MatchWeights:
      type: object
      properties:
        industrySpecificSkills:
          type: number
        technicalSkills:
          type: number
        digitalSkills:
          type: number
        softSkills:
          type: number
        experience:
          type: number
        evidence:
          type: number
        broadTechnicalAreas:
          type: number
      required: [industrySpecificSkills, technicalSkills, digitalSkills, softSkills, experience, evidence, broadTechnicalAreas]
    RoleMatch:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/JobListing"
        matchedCount:
          type: integer
        requiredCount:
          type: integer
        skillCoverage:
          type: ["number", "null"]
        technicalCoverage:
          type: ["number", "null"]
        matchedTechnicalCount:
          type: integer
        requiredTechnicalCount:
          type: integer
        relatedSkills:
          type: array
          items:
            $ref: "#/components/schemas/RelatedRoleSkill"
        titleSignals:
          type: array
          items:
            $ref: "#/components/schemas/RoleTitleSignal"
        score:
          type: ["number", "null"]
          description: Backward-compatible alias for skillCoverage.
        overallScore:
          type: ["number", "null"]
        scoreBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ScoreBreakdownItem"
        compatibilityTier:
          $ref: "#/components/schemas/CompatibilityTier"
        compatibilityLabel:
          type: string
        compatibilityReasons:
          type: array
          items:
            type: string
        experienceFit:
          $ref: "#/components/schemas/RoleExperienceFit"
        educationFit:
          $ref: "#/components/schemas/RoleEducationFit"
        matchedSkills:
          type: array
          items:
            $ref: "#/components/schemas/RoleMatchSkill"
        skillGaps:
          type: array
          items:
            $ref: "#/components/schemas/RoleMatchSkill"
        unmatchedProfileSkills:
          type: array
          items:
            type: string
        roleSdg:
          $ref: "#/components/schemas/SdgAssessment"
        improvement:
          type: string
      required: [job, matchedCount, requiredCount, skillCoverage, technicalCoverage, matchedTechnicalCount, requiredTechnicalCount, relatedSkills, titleSignals, score, overallScore, scoreBreakdown, compatibilityTier, compatibilityLabel, compatibilityReasons, experienceFit, educationFit, matchedSkills, skillGaps, unmatchedProfileSkills, roleSdg, improvement]
    RoleMatchResults:
      type: object
      properties:
        totalJobs:
          type: integer
        inputSkillCount:
          type: integer
        formula:
          type: string
          description: Skill coverage formula retained for backward compatibility.
        overallFormula:
          type: string
        weights:
          $ref: "#/components/schemas/MatchWeights"
        scoringNotes:
          type: array
          items:
            type: string
        sdgNotice:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/RoleMatch"
      required: [totalJobs, inputSkillCount, formula, overallFormula, weights, scoringNotes, sdgNotice, results]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SalaryRange:
      type: object
      properties:
        sector:
          type: string
          enum: [software, mechanical]
        disclosedCount:
          type: integer
        undisclosedCount:
          type: integer
        minimumMonthlyRm:
          type: ["number", "null"]
        maximumMonthlyRm:
          type: ["number", "null"]
      required: [sector, disclosedCount, undisclosedCount, minimumMonthlyRm, maximumMonthlyRm]
    FutureReadyOverview:
      type: object
      properties:
        totalJobs:
          type: integer
        softwareJobs:
          type: integer
        mechanicalJobs:
          type: integer
        distinctJobTitles:
          type: integer
        careerCategoryCount:
          type: integer
        careerCategories:
          type: array
          items:
            $ref: "#/components/schemas/CareerCategoryCount"
        disclosedSalaryCount:
          type: integer
        undisclosedSalaryCount:
          type: integer
        salaryRanges:
          type: array
          items:
            $ref: "#/components/schemas/SalaryRange"
        dataNotes:
          type: array
          items:
            type: string
      required: [totalJobs, softwareJobs, mechanicalJobs, distinctJobTitles, careerCategoryCount, careerCategories, disclosedSalaryCount, undisclosedSalaryCount, salaryRanges, dataNotes]
    CareerCategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required: [category, count]
    JobListing:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        company:
          type: string
        source:
          type: string
        industry:
          type: string
        education:
          type: string
        salaryMonthlyRm:
          type: ["number", "null"]
        salaryText:
          type: string
          description: Original monthly RM salary cell, including disclosed ranges or Undisclosed. No midpoint is inferred.
        experience:
          type: string
        technicalSkills:
          type: array
          items:
            type: string
        softSkills:
          type: array
          items:
            type: string
        sector:
          type: string
          description: Career category derived from the supplied job title; not the source Industry field.
          enum: [software, mechanical, digital-marketing, human-resources, accounting-finance, data-analytics]
        location:
          type: ["string", "null"]
        postingDate:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
      required: [id, title, company, source, industry, education, salaryMonthlyRm, experience, technicalSkills, softSkills, sector, location, postingDate, sourceUrl]
    SkillGapInput:
      type: object
      properties:
        sector:
          type: string
          enum: [software, mechanical]
        jobId:
          type: string
          minLength: 1
          maxLength: 80
        currentSkills:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 120
        practiceSkills:
          type: array
          description: Explicitly selected listed requirements to include in the learning roadmap; does not change coverage.
          maxItems: 100
          items:
            type: string
            maxLength: 120
      required: [sector, jobId, currentSkills]
    SkillGapSkill:
      type: object
      properties:
        skill:
          type: string
        category:
          type: string
          enum: [technical, soft]
        matchedBy:
          type: ["string", "null"]
      required: [skill, category, matchedBy]
    SkillGapLearningResource:
      type: object
      properties:
        title:
          type: string
        provider:
          type: string
        url:
          type: string
          format: uri
        resourceType:
          type: string
          enum: [documentation, tutorial, learning-path]
        costStatus:
          type: string
          enum: [free, paid, not-stated]
        costNote:
          type: string
      required: [title, provider, url, resourceType, costStatus, costNote]
    SkillGapRoadmapStep:
      type: object
      properties:
        step:
          type: integer
          minimum: 1
        skill:
          type: string
        category:
          type: string
          enum: [technical, soft]
        estimatedHoursMin:
          type: integer
          minimum: 0
        estimatedHoursMax:
          type: integer
          minimum: 0
        learningResource:
          anyOf:
            - $ref: "#/components/schemas/SkillGapLearningResource"
            - type: "null"
      required: [step, skill, category, estimatedHoursMin, estimatedHoursMax, learningResource]
    SkillGapAnalysis:
      type: object
      properties:
        selectedJob:
          $ref: "#/components/schemas/JobListing"
        matchedSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapSkill"
        missingSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapSkill"
        unmatchedInputSkills:
          type: array
          items:
            type: string
        matchedCount:
          type: integer
          minimum: 0
        requiredCount:
          type: integer
          minimum: 0
        coveragePercent:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        coverageFormula:
          type: string
        roadmapNote:
          type: string
        estimateNote:
          type: string
        roadmap:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapRoadmapStep"
      required: [selectedJob, matchedSkills, missingSkills, unmatchedInputSkills, matchedCount, requiredCount, coveragePercent, coverageFormula, roadmapNote, estimateNote, roadmap]
    UnemploymentObservation:
      type: object
      properties:
        date:
          type: string
        unemployedAge15To24:
          type: number
        unemployedAge15To30:
          type: number
        rateAge15To24:
          type: number
        rateAge15To30:
          type: number
      required: [date, unemployedAge15To24, unemployedAge15To30, rateAge15To24, rateAge15To30]
    WageObservation:
      type: object
      properties:
        date:
          type: string
        sex:
          type: string
          enum: [both, male, female]
        categoryType:
          type: string
          enum: [occupation, skill]
        category:
          type: string
        recipients:
          type: number
        medianWage:
          type: number
        meanWage:
          type: number
      required: [date, sex, categoryType, category, recipients, medianWage, meanWage]
    UnderemploymentObservation:
      type: object
      properties:
        date:
          type: string
        measure:
          type: string
          enum: [rate, persons]
        age:
          type: string
          enum: ["15-24", "25-34", "35-44", "45+", overall]
        value:
          type: number
      required: [date, measure, age, value]
    LabourMarketObservation:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Monthly observation date. Day is 01 in the source.
        lf:
          type: number
          description: Labour force size, thousands of persons.
        lf_employed:
          type: number
          description: Employed persons, thousands.
        lf_unemployed:
          type: number
          description: Unemployed persons, thousands.
        lf_outside:
          type: number
          description: Persons outside the labour force, thousands.
        p_rate:
          type: number
          description: Labour force participation rate, percent.
        ep_ratio:
          type: number
          description: Employment-population ratio, percent.
        u_rate:
          type: number
          description: Unemployment rate, percent.
      required: [date, lf, lf_employed, lf_unemployed, lf_outside, p_rate, ep_ratio, u_rate]
    LabourMarketData:
      type: object
      properties:
        sourceName:
          type: string
        datasetName:
          type: string
        catalogueUrl:
          type: string
          format: uri
        csvUrl:
          type: string
          format: uri
        latestObservationDate:
          type: string
          format: date
        catalogueLastUpdated:
          type: ["string", "null"]
        catalogueNextUpdate:
          type: ["string", "null"]
        catalogueMetadataError:
          type: ["string", "null"]
        retrievedAt:
          type: string
          format: date-time
          description: Time of the last successful external CSV retrieval; unchanged when serving a cached response.
        retrievalMode:
          type: string
          enum: [external-fetch, cache-hit, stale-cache]
          description: Whether this response followed a successful external fetch, a cache hit, or a failed refresh using cached data.
        cacheState:
          type: string
          enum: [fresh, stale]
        refreshError:
          type: ["string", "null"]
        rowsReceived:
          type: integer
          minimum: 0
        rowsValid:
          type: integer
          minimum: 1
        rejectedRows:
          type: integer
          minimum: 0
        ignoredColumns:
          type: array
          items:
            type: string
        observations:
          type: array
          items:
            $ref: "#/components/schemas/LabourMarketObservation"
      required: [sourceName, datasetName, catalogueUrl, csvUrl, latestObservationDate, catalogueLastUpdated, catalogueNextUpdate, catalogueMetadataError, retrievedAt, retrievalMode, cacheState, refreshError, rowsReceived, rowsValid, rejectedRows, ignoredColumns, observations]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

