openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: futureReady
    description: Read-only access to the supplied FutureNow datasets
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /future-ready/overview:
    get:
      operationId: getFutureReadyOverview
      tags: [futureReady]
      summary: Get a verified summary of the supplied datasets
      responses:
        "200":
          description: Dataset and job-record summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FutureReadyOverview"
  /future-ready/jobs:
    get:
      operationId: getFutureReadyJobs
      tags: [futureReady]
      summary: List the supplied job records
      responses:
        "200":
          description: Job records from the uploaded workbook
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListing"
  /future-ready/skill-gap:
    post:
      operationId: analyzeFutureReadySkillGap
      tags: [futureReady]
      summary: Compare user skills with one supplied job record
      description: Calculates deterministic coverage from distinct listed technical and soft-skill requirements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillGapInput"
      responses:
        "200":
          description: Skill comparison and learning roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGapAnalysis"
        "400":
          description: Invalid request or sector does not match the selected job
        "404":
          description: Job record not found
  /future-ready/unemployment:
    get:
      operationId: getFutureReadyUnemployment
      tags: [futureReady]
      summary: Get monthly youth unemployment observations
      responses:
        "200":
          description: Monthly observations for ages 15-24 and 15-30
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnemploymentObservation"
  /future-ready/wages:
    get:
      operationId: getFutureReadyWages
      tags: [futureReady]
      summary: Get annual wage observations by occupation or skill category
      responses:
        "200":
          description: Wage observations from both annual CSV files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WageObservation"
  /future-ready/underemployment:
    get:
      operationId: getFutureReadyUnderemployment
      tags: [futureReady]
      summary: Get quarterly skills-related underemployment observations
      responses:
        "200":
          description: Observations grouped by measure and age
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnderemploymentObservation"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SalaryRange:
      type: object
      properties:
        sector:
          type: string
          enum: [software, mechanical]
        disclosedCount:
          type: integer
        undisclosedCount:
          type: integer
        minimumMonthlyRm:
          type: ["number", "null"]
        maximumMonthlyRm:
          type: ["number", "null"]
      required: [sector, disclosedCount, undisclosedCount, minimumMonthlyRm, maximumMonthlyRm]
    FutureReadyOverview:
      type: object
      properties:
        totalJobs:
          type: integer
        softwareJobs:
          type: integer
        mechanicalJobs:
          type: integer
        distinctJobTitles:
          type: integer
        careerCategoryCount:
          type: integer
        careerCategories:
          type: array
          items:
            $ref: "#/components/schemas/CareerCategoryCount"
        disclosedSalaryCount:
          type: integer
        undisclosedSalaryCount:
          type: integer
        salaryRanges:
          type: array
          items:
            $ref: "#/components/schemas/SalaryRange"
        dataNotes:
          type: array
          items:
            type: string
      required: [totalJobs, softwareJobs, mechanicalJobs, distinctJobTitles, careerCategoryCount, careerCategories, disclosedSalaryCount, undisclosedSalaryCount, salaryRanges, dataNotes]
    CareerCategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required: [category, count]
    JobListing:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        company:
          type: string
        source:
          type: string
        industry:
          type: string
        education:
          type: string
        salaryMonthlyRm:
          type: ["number", "null"]
        salaryText:
          type: string
          description: Original monthly RM salary cell, including disclosed ranges or Undisclosed. No midpoint is inferred.
        experience:
          type: string
        technicalSkills:
          type: array
          items:
            type: string
        softSkills:
          type: array
          items:
            type: string
        sector:
          type: string
          description: Career category derived from the supplied job title; not the source Industry field.
          enum: [software, mechanical, digital-marketing, human-resources, accounting-finance, data-analytics]
        location:
          type: ["string", "null"]
        postingDate:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
      required: [id, title, company, source, industry, education, salaryMonthlyRm, experience, technicalSkills, softSkills, sector, location, postingDate, sourceUrl]
    SkillGapInput:
      type: object
      properties:
        sector:
          type: string
          enum: [software, mechanical]
        jobId:
          type: string
          minLength: 1
          maxLength: 80
        currentSkills:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 120
      required: [sector, jobId, currentSkills]
    SkillGapSkill:
      type: object
      properties:
        skill:
          type: string
        category:
          type: string
          enum: [technical, soft]
        matchedBy:
          type: ["string", "null"]
      required: [skill, category, matchedBy]
    SkillGapLearningResource:
      type: object
      properties:
        title:
          type: string
        provider:
          type: string
        url:
          type: string
          format: uri
        resourceType:
          type: string
          enum: [documentation, tutorial, learning-path]
        costStatus:
          type: string
          enum: [free, paid, not-stated]
        costNote:
          type: string
      required: [title, provider, url, resourceType, costStatus, costNote]
    SkillGapRoadmapStep:
      type: object
      properties:
        step:
          type: integer
          minimum: 1
        skill:
          type: string
        category:
          type: string
          enum: [technical, soft]
        estimatedHoursMin:
          type: integer
          minimum: 0
        estimatedHoursMax:
          type: integer
          minimum: 0
        learningResource:
          anyOf:
            - $ref: "#/components/schemas/SkillGapLearningResource"
            - type: "null"
      required: [step, skill, category, estimatedHoursMin, estimatedHoursMax, learningResource]
    SkillGapAnalysis:
      type: object
      properties:
        selectedJob:
          $ref: "#/components/schemas/JobListing"
        matchedSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapSkill"
        missingSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapSkill"
        unmatchedInputSkills:
          type: array
          items:
            type: string
        matchedCount:
          type: integer
          minimum: 0
        requiredCount:
          type: integer
          minimum: 0
        coveragePercent:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        coverageFormula:
          type: string
        roadmapNote:
          type: string
        estimateNote:
          type: string
        roadmap:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapRoadmapStep"
      required: [selectedJob, matchedSkills, missingSkills, unmatchedInputSkills, matchedCount, requiredCount, coveragePercent, coverageFormula, roadmapNote, estimateNote, roadmap]
    UnemploymentObservation:
      type: object
      properties:
        date:
          type: string
        unemployedAge15To24:
          type: number
        unemployedAge15To30:
          type: number
        rateAge15To24:
          type: number
        rateAge15To30:
          type: number
      required: [date, unemployedAge15To24, unemployedAge15To30, rateAge15To24, rateAge15To30]
    WageObservation:
      type: object
      properties:
        date:
          type: string
        sex:
          type: string
          enum: [both, male, female]
        categoryType:
          type: string
          enum: [occupation, skill]
        category:
          type: string
        recipients:
          type: number
        medianWage:
          type: number
        meanWage:
          type: number
      required: [date, sex, categoryType, category, recipients, medianWage, meanWage]
    UnderemploymentObservation:
      type: object
      properties:
        date:
          type: string
        measure:
          type: string
          enum: [rate, persons]
        age:
          type: string
          enum: ["15-24", "25-34", "35-44", "45+", overall]
        value:
          type: number
      required: [date, measure, age, value]

