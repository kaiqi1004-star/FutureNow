kind = "web"
previewPath = "/"
title = "FutureNow"
description = "A Malaysian job-skills navigator for early-career job seekers. Explore 24 supplied software and mechanical job records, compare listed requirements with your skills, and review separate national labor-market context. Scores are transparent skill coverage, not hiring predictions; source limits and salary disclosure are shown."
version = "1.0.0"
id = "artifacts/futureready-my"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19297

[services.development]
run = "pnpm --filter @workspace/futureready-my run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/futureready-my", "run", "build" ]
serve = "static"
publicDir = "artifacts/futureready-my/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19297"
BASE_PATH = "/"
