kind = "web"
previewPath = "/"
title = "FutureNow"
description = "Build and save a browser-local skills profile, explore 24 supplied software and mechanical job records, compare listed requirements with your skills, and review separate national labour-market context. Profile insights are self-reported, not aptitude tests or hiring predictions. Four planned modules are clearly marked Coming Soon."
version = "1.0.0"
id = "artifacts/futureready-my"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19297

[services.development]
run = "pnpm --filter @workspace/futureready-my run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/futureready-my", "run", "build" ]
serve = "static"
publicDir = "artifacts/futurer-now/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19297"
BASE_PATH = "/"
